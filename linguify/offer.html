<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linguify — Ζήτησε Προσφορά</title>
<style>
  :root {
    --bg:#f4f8fa; --surface:#fff; --text:#182530; --muted:#5c7080;
    --accent:#2c5f8a; --accent-soft:#dbe8f2; --green:#2f8f5b; --border:#dde6ec;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101820; --surface:#16212b; --text:#e6eef3; --muted:#93a8b8; --accent:#7fb3dd; --accent-soft:#1e3446; --green:#6fcf9a; --border:#223140; }
  }
  :root[data-theme="dark"] { --bg:#101820; --surface:#16212b; --text:#e6eef3; --muted:#93a8b8; --accent:#7fb3dd; --accent-soft:#1e3446; --green:#6fcf9a; --border:#223140; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { max-width:640px; margin:0 auto; padding:3rem 1.5rem 1rem; text-align:center; }
  a.back { color:var(--muted); font-size:0.85rem; text-decoration:none; }
  h1 { font-family:Georgia,serif; font-size:1.9rem; margin:0.8rem 0 0.3rem; }
  p.sub { color:var(--muted); margin:0 0 2rem; }
  main { max-width:640px; margin:0 auto; padding:0 1.5rem 3rem; }
  form { background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--green); border-radius:12px; padding:1.6rem; display:grid; gap:0.7rem; }
  label { font-size:0.85rem; color:var(--muted); }
  input, select, textarea { width:100%; padding:0.6rem; border-radius:6px; border:1px solid var(--border); font-family:inherit; background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; padding:0.75rem; border-radius:6px; font-weight:600; cursor:pointer; margin-top:0.5rem; }
</style>
</head>
<body>
<header>
  <a class="back" href="linguify.html">← Πίσω</a>
  <h1>Ζήτησε Προσφορά</h1>
  <p class="sub">Πες μας λίγα λόγια για το κείμενό σου και θα επικοινωνήσουμε σύντομα.</p>
</header>
<main>
  <form onsubmit="alert('Θα συνδεθεί σύντομα με αποστολή email.'); return false;">
    <label>Όνομα</label>
    <input type="text" required>
    <label>Email</label>
    <input type="email" required>
    <label>Τύπος εργασίας</label>
    <select>
      <option>Επιμέλεια κειμένου</option>
      <option>Μετάφραση</option>
      <option>Άλλο</option>
    </select>
    <label>Λίγα λόγια για το κείμενο</label>
    <textarea rows="4"></textarea>
    <button type="submit">Αποστολή αιτήματος</button>
  </form>
</main>
</body>
</html>
