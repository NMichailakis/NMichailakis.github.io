<title>Linguify</title>

  :root {
    --bg: #f4f8fa;
    --surface: #ffffff;
    --text: #182530;
    --muted: #5c7080;
    --accent: #2c5f8a;
    --accent-soft: #dbe8f2;
    --green: #2f8f5b;
    --border: #dde6ec;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101820;
      --surface: #16212b;
      --text: #e6eef3;
      --muted: #93a8b8;
      --accent: #7fb3dd;
      --accent-soft: #1e3446;
      --green: #6fcf9a;
      --border: #223140;
    }
  }
  :root[data-theme="dark"] {

  * { box-sizing: border-box; }

    background-clip: text;
    color: transparent;
  }
